[project]
dependencies = [
  "pydantic>=2.7", # typed stage artifacts
  "python-docx>=1.1.0", # Word documents
  "lxml>=5.0", # Word XML (text boxes, content controls)
  "openpyxl>=3.1", # spreadsheets
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "cryptography>=43", # AES-GCM for the locked (published) viewer
]
description = "A document pipeline that turns a kitchen's archive of recipe files into verified, structured recipes and a single-file viewer"
name = "recipify"
readme = "README.md"
requires-python = ">=3.12"
version = "0.7.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steinn Hauser Magnússon" }]
keywords = [
  "data-pipeline",
  "document-processing",
  "transcription",
  "recipes",
  "pdf",
  "static-site",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: General",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/steinnhauser/recipify"
Demo = "https://steinnhm.com/recipify/demo/"

[project.scripts]
recipify = "recipify.cli:app"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.3.0",
  "mypy>=1.9.0",
  "types-openpyxl>=3.1.5.20261017",
  "lxml-stubs>=0.5.1",
  "pre-commit>=3.7",
  "pytest-playwright>=0.5",
]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP"]
target-version = "py312"

[tool.mypy]
disallow_untyped_defs = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-v -m 'not browser'"  # browser tests: uv run pytest -m browser (own CI job)
markers = ["browser: drives the viewer in a real browser (needs Playwright's Chromium)"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["recipify"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = ['if __name__ == "__main__":']
