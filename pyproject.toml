[project]
dependencies = [
  "python-docx>=1.1.0", # .docx extraction
  "pypdf>=4.0.0", # PDF text extraction and validation
  "markdown-it-py>=3.0.0", # markdown -> HTML for the viewer
  "mistralai>=2.9.1", # OCR for scanned PDFs and images
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "cryptography>=43", # AES-GCM for the locked (published) viewer
  "openpyxl>=3.1", # .xlsx extraction
]
description = "Turn a messy folder of recipe files into versioned markdown and a single-file, privately shareable recipe viewer"
name = "recipify"
readme = "README.md"
requires-python = ">=3.12"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steinn Hauser Magnússon" }]
keywords = ["recipes", "ocr", "document-conversion", "markdown", "static-site", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/steinnhauser/recipify"
Demo = "https://steinnhm.com/recipify/demo/"

[project.scripts]
recipify = "recipify.cli:app"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.3.0",
  "mypy>=1.9.0",
  "types-openpyxl>=3.1.5.20261017",
]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "N", "W", "UP"]
target-version = "py312"

[tool.mypy]
disallow_untyped_defs = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-v"
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["recipify"]

[tool.coverage.report]
show_missing = true
fail_under = 96
exclude_also = ['if __name__ == "__main__":']
