<script>
(() => {  // no globals: they would survive document.write and clash with the viewer's own
  const LS = 'recipify-key', $ = id => document.getElementById(id);
  const P = JSON.parse($('payload').textContent);
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const get = () => { try { return localStorage.getItem(LS); } catch (e) { return null; } };
  const put = v => { try { v ? localStorage.setItem(LS, v) : localStorage.removeItem(LS); } catch (e) {} };
  async function decrypt(pass) {
    const enc = new TextEncoder(), s = crypto.subtle;
    const base = await s.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await s.deriveKey({name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    return new TextDecoder().decode(await s.decrypt({name: 'AES-GCM', iv: bytes(P.iv)}, key, bytes(P.ct)));
  }
  async function open(pass, remember) {
    let page;
    try { page = await decrypt(pass); } catch (e) { return false; }
    put(remember ? pass : null);
    document.open(); document.write(page); document.close();
    return true;
  }
  function ask(text, isErr) {
    $('msg').textContent = text; $('msg').className = isErr ? 'err' : '';
    $('f').hidden = $('rem').hidden = false; $('k').focus();
  }
  async function start() {
    if (!window.crypto || !crypto.subtle) return ask('This browser cannot open the page. Please use an up-to-date Safari, Chrome, Edge or Firefox.', true);
    const m = location.hash.match(/^#key=(.+)$/);
    if (m) {  // take the key out of the address bar before anything else
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      let pass = m[1]; try { pass = decodeURIComponent(pass); } catch (e) {}
      if (await open(pass, true)) return;
      return ask('The key in this link does not open this page (the page may have been updated). Ask for a new link, or enter the key.', true);
    }
    const saved = get();
    if (saved) { if (await open(saved, true)) return; put(null); }
    ask('This recipe collection is private. Open it with the link you were given, or enter the key.');
  }
  $('f').onsubmit = async e => {
    e.preventDefault(); $('go').disabled = true; $('msg').textContent = 'Opening…'; $('msg').className = '';
    if (!await open($('k').value, $('remember').checked)) { $('go').disabled = false; ask('That key does not open this page.', true); }
  };
  start();
})();
</script>
