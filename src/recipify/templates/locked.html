<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>__TITLE__</title>
<style>
:root{--bg:#fbf9f6;--ink:#2b2622;--muted:#8a8178;--accent:#b4532a;--line:#ece5db}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:24rem;margin:18vh auto 0;padding:0 1.2rem}
h1{color:var(--accent);font-size:1.5rem;font-weight:600;margin:0 0 .5rem}
p{color:var(--muted);font-size:.95rem}p.err{color:#a3341a}
form{display:flex;gap:.5rem;margin-top:1rem}
input[type=password]{flex:1;min-width:0;font:inherit;font-size:16px;padding:.45rem .7rem;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{font:inherit;padding:.45rem 1rem;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
label{display:block;margin-top:.7rem;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>recipify</h1>
<p id="msg">Opening…</p>
<form id="f" hidden>
  <input id="k" type="password" placeholder="Key" autocomplete="current-password" aria-label="Key">
  <button id="go">Open</button>
</form>
<label id="rem" hidden><input type="checkbox" id="remember" checked> Remember on this device</label>
<noscript><p class="err">This page needs JavaScript. On iPhone or iPad, open the link in Safari.</p></noscript>
</main>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(() => {  // no globals: they would survive document.write and clash with the viewer's own
  const LS = 'recipify-key', $ = id => document.getElementById(id);
  const P = JSON.parse($('payload').textContent);
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const get = () => { try { return localStorage.getItem(LS); } catch (e) { return null; } };
  const put = v => { try { v ? localStorage.setItem(LS, v) : localStorage.removeItem(LS); } catch (e) {} };
  async function decrypt(pass) {
    const enc = new TextEncoder(), s = crypto.subtle;
    const base = await s.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await s.deriveKey({name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    return new TextDecoder().decode(await s.decrypt({name: 'AES-GCM', iv: bytes(P.iv)}, key, bytes(P.ct)));
  }
  async function open(pass, remember) {
    let page;
    try { page = await decrypt(pass); } catch (e) { return false; }
    put(remember ? pass : null);
    document.open(); document.write(page); document.close();
    return true;
  }
  function ask(text, isErr) {
    $('msg').textContent = text; $('msg').className = isErr ? 'err' : '';
    $('f').hidden = $('rem').hidden = false; $('k').focus();
  }
  async function start() {
    if (!window.crypto || !crypto.subtle) return ask('This browser cannot open the page. Please use an up-to-date Safari, Chrome, Edge or Firefox.', true);
    const m = location.hash.match(/^#key=(.+)$/);
    if (m) {  // take the key out of the address bar before anything else
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      let pass = m[1]; try { pass = decodeURIComponent(pass); } catch (e) {}
      if (await open(pass, true)) return;
      return ask('The key in this link does not open this page (the page may have been updated). Ask for a new link, or enter the key.', true);
    }
    const saved = get();
    if (saved) { if (await open(saved, true)) return; put(null); }
    ask('This recipe collection is private. Open it with the link you were given, or enter the key.');
  }
  $('f').onsubmit = async e => {
    e.preventDefault(); $('go').disabled = true; $('msg').textContent = 'Opening…'; $('msg').className = '';
    if (!await open($('k').value, $('remember').checked)) { $('go').disabled = false; ask('That key does not open this page.', true); }
  };
  start();
})();
</script>
</body>
</html>
