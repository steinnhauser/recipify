# Lints, type-checks and tests every push and pull request. On main, a passing run then
# publishes site/ to GitHub Pages:
#   /           the private collection, encrypted locally with `uv run recipify lock` (committed)
#   /demo/      the whole pipeline run here on the sample documents in examples/sources
#   /coverage/  the pytest coverage report, plus badge.json for the README badge
# Recipes from the private collection never reach the repository in plain text.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install poppler (PDF text extraction)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests examples
          uv run ruff format --check src tests examples
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q --cov --cov-report=term --cov-report=html --cov-report=xml --cov-report=json

      - name: Write the coverage badge
        if: matrix.python == '3.13'
        run: |
          jq '.totals.percent_covered as $p | {
                schemaVersion: 1,
                label: "coverage",
                message: (.totals.percent_covered_display + "%"),
                color: (if $p >= 90 then "brightgreen" elif $p >= 75 then "green"
                        elif $p >= 60 then "yellow" else "red" end)
              }' coverage.json > htmlcov/badge.json
          cp coverage.xml htmlcov/
          echo "### Coverage: $(jq -r .message htmlcov/badge.json)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage report
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to publish an unencrypted page
        run: |
          for f in site/*.html; do
            grep -q '<script id="payload" type="application/json">' "$f" \
              || { echo "::error file=$f::not an encrypted page (run: uv run recipify lock)"; exit 1; }
          done

      - uses: astral-sh/setup-uv@v7

      - name: Check the page opens with ENCRYPTION_KEY
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          if [ -z "$ENCRYPTION_KEY" ]; then
            echo "::warning::ENCRYPTION_KEY secret not set; skipping the key check"
          else
            uv run recipify lock --verify
          fi

      - name: Run the pipeline on the sample documents (public demo)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          uv run recipify demo --out site/demo/index.html --report site/demo/report.md
          cat site/demo/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add the coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: site/coverage

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
