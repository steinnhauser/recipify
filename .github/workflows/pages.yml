# Publishes site/ to GitHub Pages:
#   /       the private collection, encrypted locally with `uv run recipify lock` (committed)
#   /demo/  a public demo built here from examples/recipes with `uv run recipify demo`
# Recipes from the private collection never reach the repository in plain text.
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "examples/**", "src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish an unencrypted page
        run: |
          for f in site/*.html; do
            grep -q '<script id="payload" type="application/json">' "$f" \
              || { echo "::error file=$f::not an encrypted page (run: uv run recipify lock)"; exit 1; }
          done

      - uses: astral-sh/setup-uv@v6

      - name: Check the page opens with ENCRYPTION_KEY
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          if [ -z "$ENCRYPTION_KEY" ]; then
            echo "::warning::ENCRYPTION_KEY secret not set; skipping the key check"
          else
            uv run recipify lock --verify
          fi

      - name: Build the public demo
        run: uv run recipify demo --out site/demo/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
