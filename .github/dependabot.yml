version: 2

updates:
  - package-ecosystem: uv
    directory: "/"
    schedule: { interval: weekly }
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "ci" }
